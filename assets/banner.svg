<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 034</title>
  <desc>A small multicolour hand-carved rubber-stamp landscape with broken ink, slight registration shift, warm fibrous paper, generous whitespace, and quiet field annotation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="31" height="27" patternUnits="userSpaceOnUse"><path d="M2 8L14 6M19 22L30 20M7 27L17 24" stroke="#75634B" stroke-opacity=".08" stroke-width=".8"/></pattern>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".34" numOctaves="3" seed="34" result="n"/><feComposite in="n" in2="SourceGraphic" operator="in" result="t"/><feBlend in="SourceGraphic" in2="t" mode="screen"/></filter>
    <clipPath id="stamp"><rect x="828" y="92" width="220" height="170" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F3EBDD"/><rect width="1200" height="400" fill="url(#paper)"/>
    <g transform="translate(60 47)">
      <rect width="230" height="34" rx="7" fill="#2D514A"/><text x="17" y="22" fill="#FFF8EA" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
      <text x="0" y="112" fill="#332D26" font-family="Georgia, serif" font-size="67" font-weight="700" letter-spacing="-3">PANEL <tspan fill="#C9533E">034</tspan></text>
      <text x="2" y="151" fill="#2D514A" font-family="Arial, sans-serif" font-size="17" font-weight="900" letter-spacing=".6">RUBBER STAMP · SPOT INKS · FIELD NOTE</text>
      <text x="2" y="195" fill="#332D26" font-family="sans-serif" font-size="18" font-weight="800">多色橡皮章 · 手刻盖印 · 暖纸留白 · 田野注释</text>
      <text x="2" y="226" fill="#332D26" fill-opacity=".74" font-family="sans-serif" font-size="14" font-weight="700">多色ゴム版の野外記録 · 다색 고무도장 현장 기록</text>
      <text x="2" y="257" fill="#332D26" fill-opacity=".74" font-family="Arial, sans-serif" font-size="14" font-weight="700">ختم مطاطي متعدد الألوان وملاحظة ميدانية</text>
    </g>
    <g transform="translate(60 326)">
      <rect width="116" height="38" rx="7" fill="#2D514A"/><text x="58" y="25" text-anchor="middle" fill="white" font-family="Courier New, monospace" font-size="12" font-weight="900">SMALL STAMP</text>
      <rect x="128" width="126" height="38" rx="7" fill="#C9533E"/><text x="191" y="25" text-anchor="middle" fill="white" font-family="Courier New, monospace" font-size="12" font-weight="900">2–4 SPOT INKS</text>
      <rect x="266" width="105" height="38" rx="7" fill="#D8A744"/><text x="318.5" y="25" text-anchor="middle" fill="#332D26" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
      <rect x="383" width="177" height="38" rx="7" fill="#A6B9A9"/><text x="471.5" y="25" text-anchor="middle" fill="#332D26" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
    </g>
    <g clip-path="url(#stamp)" filter="url(#ink)">
      <path d="M821 249L895 151L945 202L982 153L1059 249Z" fill="#2D514A"/>
      <path d="M821 250C879 224 928 237 1058 211V275H821Z" fill="#4D8290" transform="translate(4 3)"/>
      <circle cx="1003" cy="126" r="30" fill="#D8A744" transform="translate(-3 2)"/>
      <path d="M876 143C892 132 909 133 925 146C909 143 894 146 879 156" stroke="#C9533E" stroke-width="9" stroke-linecap="round"/>
      <path d="M848 190L878 172M934 189L958 170M895 228L915 211M985 223L1011 203" stroke="#F3EBDD" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    </g>
    <path d="M810 276H1071" stroke="#75634B" stroke-opacity=".3" stroke-dasharray="4 5"/>
    <text x="811" y="299" fill="#332D26" font-family="Courier New, monospace" font-size="13" font-weight="700">RIDGE AFTER RAIN  ·  No. 034</text>
    <text x="811" y="321" fill="#332D26" fill-opacity=".62" font-family="Courier New, monospace" font-size="10" letter-spacing="1.5">QUIET / WINDWARD / OBSERVED</text>
    <text x="811" y="354" fill="#75634B" fill-opacity=".55" font-family="Courier New, monospace" font-size="10">one impression · large field</text>
  </g>
</svg>
